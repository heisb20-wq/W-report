<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة التوريد مقابل السحب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef3f5;--surface:#fff;--ink:#12303b;--muted:#5b7580;--line:#d3dfe4;--accent:#0b5d7a;--ok:#14733f;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe6e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b21;--surface:#162830;--ink:#e6f0f3;--muted:#8fa8b2;--line:#27404a;--accent:#5bbbd9;--ok:#5fd18f;--okbg:#10331f;--bad:#ff8a80;--badbg:#3a1815}}
:root[data-theme="dark"]{--bg:#0e1b21;--surface:#162830;--ink:#e6f0f3;--muted:#8fa8b2;--line:#27404a;--accent:#5bbbd9;--ok:#5fd18f;--okbg:#10331f;--bad:#ff8a80;--badbg:#3a1815}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.6 Tajawal,Tahoma,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;font-weight:800;margin:0;color:var(--accent)}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:500;margin-bottom:4px;color:var(--muted);font-size:14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 18px;min-height:44px;cursor:pointer}
.btn.alt{background:none;color:var(--accent);border:1px solid var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.status{border-radius:10px;padding:18px 16px;font-size:26px;font-weight:800;margin-bottom:16px}
.status small{display:block;font-size:15px;font-weight:500;margin-top:4px}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.bad{background:var(--badbg);color:var(--bad)}
.status.none{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.m{border-bottom:1px solid var(--line);padding:6px 2px}
.m span{display:block;color:var(--muted);font-size:13px}
.m b{font-size:26px;font-weight:800}
.m b i{font-style:normal;font-size:13px;font-weight:400;color:var(--muted)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.warn{background:var(--badbg);color:var(--bad);border-radius:8px;padding:12px;margin:12px 0}
.okmsg{background:var(--okbg);color:var(--ok);border-radius:8px;padding:12px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
textarea{width:100%;min-height:120px;font:13px monospace;direction:ltr;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;margin-top:8px}
svg text{font-family:inherit}
.hide{display:none}
.hdr-r{display:flex;gap:12px;align-items:flex-end}
#clk{font-weight:800;font-size:20px;color:var(--accent);padding-bottom:9px;white-space:nowrap;direction:ltr}
.sig{margin-top:22px;font-size:12px;color:var(--muted);text-align:left;unicode-bidi:plaintext;word-break:break-all}
/* منطقة التقرير النظيف (للطباعة و PDF) */
#pa{position:fixed;left:-10000px;top:0;width:210mm;background:#fff;color:#12303b;padding:10mm 12mm 18mm;font-size:14px;line-height:1.6;--muted:#5b7580;--line:#d3dfe4;--ok:#14733f;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe6e4;--accent:#0b5d7a;--surface:#fff;--ink:#12303b}
#pa h1{font-size:22px;margin:0 0 12px}
#pa h2{font-size:16px;margin:0 0 10px;color:#12303b}
#pa .panel{background:#fff;border:0;padding:0;margin-bottom:14px}
#pa .grid{grid-template-columns:repeat(3,1fr);gap:8px 14px}
#pa .m b{font-size:22px}
#pa .scroll{overflow:visible}
#pa table{min-width:0;font-size:10.5px}
#pa th,#pa td{white-space:normal;padding:6px 3px}
#pa .status{font-size:22px;padding:14px}
@media print{html,body{background:#fff!important;height:auto}:root{padding:0}.wrap{display:none!important}#pa{position:static;left:auto;width:210mm;margin:0}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<header>
<h1>متابعة التوريد مقابل السحب</h1>
<div class="hdr-r noprint"><div style="width:160px"><label for="dt">التاريخ</label><input id="dt" type="text" inputmode="numeric" dir="ltr" placeholder="YYYY-MM-DD" maxlength="10"></div><div id="clk" aria-label="الساعة"></div></div>
</header>
<nav class="noprint" role="tablist" id="nav"></nav>
<main id="v"></main>
</div>
<script>
var T=[["04:00",4],["08:00",8],["12:00",12],["16:00",16],["20:00",20],["23:59",24]];
var LB={"04:00":"4:00 AM","08:00":"8:00 AM","12:00":"12:00 PM","16:00":"4:00 PM","20:00":"8:00 PM","23:59":"11:59 PM"};
function L(t){return LB[t]||t}
function en(s){return String(s).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[\u066B\u060C]/g,".")}
function clockStr(){return new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
var KEY="svc-readings-v2",mem={},tab="dash",date=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),pending=null,msg="";
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):mem}catch(e){return mem}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){mem=db}}
var db=load();
var SK="svc-settings-v1",S={sig:"",showTank:true};
try{var q0=localStorage.getItem(SK);if(q0)S=Object.assign(S,JSON.parse(q0))}catch(e){}
function saveS(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function sigHtml(){return S.sig?'<div class="sig">'+esc(S.sig)+"</div>":""}
function n(x,d){if(x==null||isNaN(x))return"—";return Number(x.toFixed(d==null?2:d)).toLocaleString("en-US")}
function sg(x){return(x>0?"+":"")+n(x)}
function rows(d){var o=db[d]||{},mode=o._mode||"period",out=[],ps=0,pc=0,sS=0,sC=0,t0=(o._open==null?null:o._open);
T.forEach(function(t){var r=o[t[0]];if(!r)return;var h=t[1],S,C,pS,pC;
if(mode==="period"){pS=r.s;pC=r.c;sS+=pS;sC+=pC;S=sS;C=sC}else{S=r.s;C=r.c;pS=S-ps;pC=C-pc;ps=S;pc=C}
var aS=S/h,aC=C/h,df=aS-aC;out.push({t:t[0],h:h,c:C,s:S,ps:pS,pc:pC,aC:aC,aS:aS,df:df,cd:S-C,ok:df>=0,open:t0,tank:t0==null?null:t0+S-C})});return out}
function cov(r){if(!(r.c>0))return null;if(r.s>=r.c)return(r.s-r.c)/r.c*100;if(!(r.s>0))return-100;return-(r.c-r.s)/r.s*100}
function pct(c){if(c==null)return"—";var t=(c>0?"+":"")+n(c)+"%";return c<0?'<span class="bad-t">'+t+"</span>":c>0?'<span class="ok-t">'+t+"</span>":t}
function stTxt(ok){return ok?"🟢 التوريد مساوي أو أعلى من السحب":"🔴 التوريد أقل من السحب"}
function cls(ok){return ok?"ok-t":"bad-t"}
function summary(r,label,hideTank){var c=cov(r);var dc='<span class="'+cls(r.ok)+'" style="display:inline;color:inherit">';
var tk=hideTank?"":r.tank==null?m("رصيد الخزان الحالي","—","أدخل رصيد بداية اليوم"):m("رصيد الخزان الحالي",'<span class="'+(r.tank<0?"bad-t":"")+'" style="display:inline;color:inherit">'+n(r.tank)+"</span>","طن")+m("رصيد الخزان بداية اليوم",n(r.open),"طن");
return'<div class="grid">'+
m("إجمالي كمية السحب",n(r.c),"طن")+m("إجمالي كمية التوريد",n(r.s),"طن")+tk+
m("معدل السحب التراكمي",n(r.aC),"طن/ساعة")+m("معدل التوريد التراكمي",n(r.aS),"طن/ساعة")+
m("فرق المعدل (توريد − سحب)",dc+sg(r.df)+"</span>","طن/ساعة")+
m(label,dc+sg(r.cd)+"</span>","طن")+
m("نسبة تغطية التوريد",pct(c),"")+
m("الساعات المحتسبة",n(r.h),"ساعة")+"</div>"}
function m(a,b,u){return'<div class="m"><span>'+a+"</span><b>"+b+(u?" <i>"+u+"</i>":"")+"</b></div>"}
function table(rs,hideTank){if(!rs.length)return'<p style="color:var(--muted)">لا توجد قراءات لهذا اليوم بعد.</p>';var tk=rs[0].tank!=null&&!hideTank;
var h="<div class=scroll><table><tr><th>الوقت</th><th>سحب الفترة</th><th>توريد الفترة</th><th>إجمالي السحب</th><th>إجمالي التوريد</th><th>معدل السحب/ساعة</th><th>معدل التوريد/ساعة</th><th>فرق المعدل</th><th>الفرق التراكمي</th>"+(tk?"<th>رصيد الخزان</th>":"")+"<th>الحالة</th></tr>";
rs.forEach(function(r){h+="<tr><td>"+L(r.t)+"</td><td>"+n(r.pc)+"</td><td>"+n(r.ps)+"</td><td>"+n(r.c)+"</td><td>"+n(r.s)+"</td><td>"+n(r.aC)+"</td><td>"+n(r.aS)+'</td><td class="'+cls(r.ok)+'">'+sg(r.df)+'</td><td class="'+cls(r.ok)+'">'+sg(r.cd)+"</td>"+(tk?'<td class="'+(r.tank<0?"bad-t":"")+'">'+n(r.tank)+"</td>":"")+"<td>"+(r.ok?"🟢":"🔴")+"</td></tr>"});
return h+"</table></div>"}
function chart(rs){if(rs.length<1)return"";var W=640,H=230,p=44,vals=[];rs.forEach(function(r){vals.push(r.aS,r.aC)});
var lo=Math.min.apply(0,vals),hi=Math.max.apply(0,vals),pad=Math.max((hi-lo)*.4,5);lo-=pad;hi+=pad;
function X(h){return W-p-(h/24)*(W-2*p)}function Y(v){return H-30-(v-lo)/(hi-lo)*(H-50)}
function line(k,col){var d=rs.map(function(r,i){return(i?"L":"M")+X(r.h).toFixed(1)+" "+Y(r[k]).toFixed(1)}).join(" ");
return'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3"/>'+rs.map(function(r){return'<circle cx="'+X(r.h)+'" cy="'+Y(r[k])+'" r="4" fill="'+col+'"/>'}).join("")}
var g="";T.forEach(function(t){g+='<text x="'+X(t[1])+'" y="'+(H-8)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+L(t[0])+"</text>"});
[lo+pad*.5,(lo+hi)/2,hi-pad*.5].forEach(function(v){g+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(W-p+6)+'" y="'+(Y(v)+4)+'" font-size="11" fill="var(--muted)">'+n(v,1)+"</text>"});
return'<div class="panel noprint"><h2>المعدل التراكمي طن/ساعة خلال اليوم</h2><div class=scroll><svg viewBox="0 0 '+W+" "+H+'" style="min-width:520px;width:100%" role="img" aria-label="رسم متوسط التوريد والسحب">'+g+line("aC","var(--bad)")+line("aS","var(--ok)")+'</svg></div><div style="display:flex;gap:16px;font-size:14px"><span class="ok-t">● معدل التوريد</span><span class="bad-t">● معدل السحب</span></div></div>'}
function dash(){var rs=rows(date),l=rs[rs.length-1],h='<div class="panel" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><span style="color:var(--muted)">التاريخ</span><br><b>'+date+'</b></div><div><span style="color:var(--muted)">آخر قراءة</span><br><b>'+(l?L(l.t):"—")+"</b></div></div>";
if(!l)return h+'<div class="status none">لا توجد قراءات لهذا اليوم<small>أدخل أول قراءة من تبويب «إدخال القراءة».</small></div>';
return h+'<div class="status '+(l.ok?"ok":"bad")+'">'+stTxt(l.ok)+"<small>"+(l.ok?"التوريد يغطي السحب":"التوريد أقل من السحب بمعدل "+n(Math.abs(l.df))+" طن/ساعة")+"</small></div>"+'<div class="panel">'+summary(l,"الفرق التراكمي")+"</div>"+chart(rs)+'<div class="panel"><h2>جدول 24 ساعة</h2>'+table(rs)+"</div>"}
function entry(){var o=db[date]||{},mode=o._mode||"period",opt=T.map(function(t){return'<option value="'+t[0]+'">'+L(t[0])+"</option>"}).join(""),per=mode==="period";
return'<div class="panel"><h2>إعدادات اليوم</h2><div class="row2"><div><label for="md">طريقة الإدخال</label><select id="md"><option value="period"'+(per?" selected":"")+'>كمية الفترة (الإجمالي يُجمع تلقائيًا)</option><option value="cum"'+(per?"":" selected")+'>قيمة تراكمية منذ بداية اليوم</option></select></div><div><label for="op">رصيد الخزان في بداية اليوم (طن)</label><input id="op" type="text" inputmode="decimal" dir="ltr" placeholder="0" value="'+(o._open==null?"":o._open)+'"></div></div><div class="bar"><button class="btn alt" data-a="saveopen">حفظ رصيد البداية</button></div></div>'+
'<div class="panel"><h2>إدخال القراءة</h2><p style="color:var(--muted);margin-top:0">'+(per?"أدخل كمية التوريد والسحب لهذه الفترة فقط. الإجمالي ورصيد الخزان يُحسبان تلقائيًا.":"أدخل القيم التراكمية منذ بداية اليوم، وليس كمية الفترة.")+'</p><div class="row2"><div><label for="tm">وقت القراءة</label><select id="tm">'+opt+'</select></div><div><label for="sp">'+(per?"كمية التوريد في الفترة (طن)":"التوريد التراكمي (طن)")+'</label><input id="sp" type="text" inputmode="decimal" dir="ltr" placeholder="0"></div><div><label for="cs">'+(per?"كمية السحب في الفترة (طن)":"السحب التراكمي (طن)")+'</label><input id="cs" type="text" inputmode="decimal" dir="ltr" placeholder="0"></div></div><div id="alert">'+msg+'</div><div class="bar"><button class="btn" data-a="save">حفظ القراءة</button></div></div><div class="panel"><h2>قراءات '+date+"</h2>"+table(rows(date))+"</div>"}
function report(){var rs=rows(date);if(!rs.length)return'<div class="panel"><h2>تقرير متابعة التوريد والاستهلاك اليومي</h2><p>لا توجد قراءات لتاريخ '+date+".</p></div>";
var l=rs[rs.length-1],fin=l.t==="23:59",hide=!S.showTank;
return'<div class="panel"><h2>تقرير متابعة التوريد والاستهلاك اليومي</h2><p style="margin-top:0">التاريخ: <b>'+date+'</b> — الساعة: <b dir="ltr" style="unicode-bidi:isolate">'+clockStr()+"</b> — عدد القراءات: "+rs.length+" من 6</p></div>"+
'<div class="panel"><h2>'+(fin?"النتيجة النهائية — الإجماليات والمعدلات التراكمية":"النتيجة الحالية (اليوم لم يكتمل) — الإجماليات والمعدلات التراكمية")+"</h2>"+summary(l,fin&&l.cd<0?"العجز التراكمي":"الفرق التراكمي",hide)+'<div class="status '+(l.ok?"ok":"bad")+'" style="margin:14px 0 0">'+stTxt(l.ok)+"</div></div>"+
'<div class="panel"><h2>جدول القراءات</h2>'+table(rs,hide)+"</div>"+sigHtml()+
'<div class="bar"><label style="display:flex;gap:8px;align-items:center;margin:0;width:100%"><input type="checkbox" id="st2" style="width:auto;min-height:0"'+(S.showTank?" checked":"")+'>إظهار رصيد الخزان في التقرير</label><button class="btn" data-a="pdf">تنزيل PDF</button><button class="btn alt" data-a="csv">تنزيل CSV</button><button class="btn alt" data-a="print">طباعة</button></div><div id="csvbox"></div>'}
function hist(){var from=hist.f||"",to=hist.t||"";var ds=Object.keys(db).sort().reverse().filter(function(d){return(!from||d>=from)&&(!to||d<=to)});
var h='<div class="panel"><h2>التقارير السابقة</h2><div class="row2"><div><label for="hf">من</label><input id="hf" type="text" inputmode="numeric" dir="ltr" placeholder="YYYY-MM-DD" maxlength="10" value="'+from+'"></div><div><label for="ht">إلى</label><input id="ht" type="text" inputmode="numeric" dir="ltr" placeholder="YYYY-MM-DD" maxlength="10" value="'+to+'"></div></div>';
if(!ds.length)return h+'<p style="color:var(--muted)">لا توجد تقارير في هذا النطاق.</p></div>';
h+="<div class=scroll><table><tr><th>التاريخ</th><th>إجمالي السحب</th><th>إجمالي التوريد</th><th>معدل السحب</th><th>معدل التوريد</th><th>الفرق</th><th>التغطية</th><th>رصيد الخزان</th><th>الحالة</th><th></th></tr>";
ds.forEach(function(d){var rs=rows(d),l=rs[rs.length-1];if(!l)return;var c=cov(l);h+="<tr><td>"+d+"</td><td>"+n(l.c)+"</td><td>"+n(l.s)+"</td><td>"+n(l.aC)+"</td><td>"+n(l.aS)+'</td><td class="'+cls(l.ok)+'">'+sg(l.df)+"</td><td>"+pct(c)+"</td><td>"+(l.tank==null?"—":n(l.tank))+"</td><td>"+(l.ok?"🟢":"🔴")+'</td><td><button class="btn alt" style="min-height:36px;padding:4px 12px" data-open="'+d+'">فتح</button></td></tr>'});
return h+'</table></div><div class="bar"><button class="btn alt" data-a="csvall">تنزيل CSV</button><button class="btn alt" data-a="reset">مسح كل البيانات</button></div><div id="csvbox"></div></div>'}
function settings(){return'<div class="panel"><h2>الإعدادات</h2><div style="margin-bottom:14px"><label for="sg">النص أسفل التقرير (يسار الصفحة): اسم أو رابط أو بريد</label><input id="sg" type="text" dir="auto" value="'+esc(S.sig)+'" placeholder="مثال: name@example.com"></div><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px"><input type="checkbox" id="st" style="width:auto;min-height:0"'+(S.showTank?" checked":"")+'>إظهار رصيد الخزان في التقرير</label><div id="alert">'+msg+'</div><div class="bar"><button class="btn" data-a="savesettings">حفظ الإعدادات</button></div></div>'}
var TABS=[["dash","لوحة المتابعة"],["entry","إدخال القراءة"],["report","التقرير اليومي"],["hist","التقارير السابقة"],["settings","الإعدادات"]];
function render(){document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button role="tab" aria-selected="'+(t[0]===tab)+'" data-tab="'+t[0]+'">'+t[1]+"</button>"}).join("");
document.getElementById("v").innerHTML=({dash:dash,entry:entry,report:report,hist:hist,settings:settings})[tab]();
document.getElementById("dt").value=date;if(tab==="entry")fill()}
function fill(){var r=(db[date]||{})[document.getElementById("tm").value];document.getElementById("sp").value=r?r.s:"";document.getElementById("cs").value=r?r.c:""}
function saveOpen(){var raw=en(document.getElementById("op").value).trim(),o=(db[date]=db[date]||{});
if(raw===""){delete o._open;msg='<div class="okmsg">تم حذف رصيد بداية اليوم.</div>'}
else{var v=parseFloat(raw);if(isNaN(v)||v<0){msg='<div class="warn">أدخل رصيدًا صحيحًا بالطن.</div>';return render()}o._open=v;msg='<div class="okmsg">تم حفظ رصيد بداية اليوم.</div>'}
persist();render()}
function setMode(m){var o=db[date]=db[date]||{};if((o._mode||"period")===m)return;var rs=rows(date);rs.forEach(function(r){o[r.t]=m==="cum"?{s:r.s,c:r.c}:{s:r.ps,c:r.pc}});o._mode=m;persist();msg="";render()}
function save(force){var t=document.getElementById("tm").value,s=parseFloat(en(document.getElementById("sp").value)),c=parseFloat(en(document.getElementById("cs").value));
if(isNaN(s)||isNaN(c)||s<0||c<0){msg='<div class="warn">أدخل رقمين صحيحين للتوريد والسحب.</div>';return render2(t,s,c)}
var o=db[date]||{},mode=o._mode||"period",hrs=T.filter(function(x){return x[0]===t})[0][1],prev=null,w=[];
if(mode==="cum"){rows(date).forEach(function(r){if(r.h<hrs)prev=r});
if(prev){if(s<prev.s)w.push("قيمة التوريد الجديدة أقل من القراءة السابقة ("+L(prev.t)+").");if(c<prev.c)w.push("قيمة السحب الجديدة أقل من القراءة السابقة ("+L(prev.t)+").")}}
var keep=db[date];db[date]=JSON.parse(JSON.stringify(o));db[date][t]={s:s,c:c};var chk=rows(date);db[date]=keep;if(!keep)delete db[date];
var neg=chk.filter(function(r){return r.tank!=null&&r.tank<0})[0];if(neg)w.push("رصيد الخزان سيصبح سالبًا ("+n(neg.tank)+" طن) عند "+L(neg.t)+".");
if(w.length&&!force){pending=[t,s,c];msg='<div class="warn"><b>تنبيه:</b> '+w.join(" ")+(mode==="cum"?" بما أن القراءة تراكمية، يجب التأكد من البيانات.":" تأكد من الأرقام.")+'<div class="bar"><button class="btn alt" data-a="force">حفظ كما هو</button></div></div>';return render2(t,s,c)}
var d=(db[date]=db[date]||{});d._mode=d._mode||"period";d[t]={s:s,c:c};persist();pending=null;msg='<div class="okmsg">تم حفظ قراءة '+L(t)+".</div>";tab="entry";render()}
function render2(t,s,c){render();document.getElementById("tm").value=t;document.getElementById("sp").value=isNaN(s)?"":s;document.getElementById("cs").value=isNaN(c)?"":c}
function csvOf(ds){var tk=S.showTank;var out=["date,time,hours,period_consumption,period_supply,total_consumption,total_supply,avg_consumption_per_hour,avg_supply_per_hour,avg_difference,cumulative_difference,coverage_percent,"+(tk?"tank_balance,":"")+"status"];
ds.forEach(function(d){rows(d).forEach(function(r){var c=cov(r);var a=[d,L(r.t),r.h,r.pc,r.ps,r.c,r.s,r.aC.toFixed(2),r.aS.toFixed(2),r.df.toFixed(2),r.cd,c==null?"":c.toFixed(2)];if(tk)a.push(r.tank==null?"":r.tank);a.push(r.ok?"supply>=consumption":"supply<consumption");out.push(a.join(","))})});return out.join("\n")}
function showCsv(text){var b=document.getElementById("csvbox");b.innerHTML='<textarea id="ct" readonly></textarea><div class="bar"><button class="btn alt" data-a="copy">نسخ إلى الحافظة</button></div><p style="color:var(--muted);font-size:14px">الصق النص في Excel أو في ملف .csv.</p>';document.getElementById("ct").value=text}
function dl(name,data,fb){var box=document.getElementById("csvbox");
try{var bl=new Blob([data],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),k=document.createElement("a");k.href=u;k.download=name;document.body.appendChild(k);k.click();setTimeout(function(){URL.revokeObjectURL(u);k.remove()},1500);if(box)box.innerHTML='<div class="okmsg">تم تجهيز الملف.</div>'}
catch(x){if(fb)showCsv(fb)}}
function buildPA(){var pa=document.getElementById("pa");if(!pa){pa=document.createElement("div");pa.id="pa";pa.setAttribute("aria-hidden","true");document.body.appendChild(pa)}
var h=report().replace(/<div class="bar">[\s\S]*$/,"");pa.innerHTML="<h1>متابعة التوريد مقابل السحب</h1>"+h;
var mm=Math.ceil(pa.offsetHeight*0.2646)+2,st=document.getElementById("pg");if(!st){st=document.createElement("style");st.id="pg";document.head.appendChild(st)}
st.textContent="@page{size:210mm "+mm+"mm;margin:0}";return pa}
function loadJs(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function doPrint(){try{buildPA();window.print()}catch(x){}}
function doPdf(){var box=document.getElementById("csvbox"),pa=buildPA(),nm="report-"+date+".pdf";
function msgb(t,c){if(box)box.innerHTML='<div class="'+c+'">'+t+"</div>"}

A.then(function(){return window.jspdf?0:loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")})
.then(function(){return(document.fonts&&document.fonts.ready)||0})
.then(function(){return html2canvas(pa,{scale:2,backgroundColor:"#ffffff",scrollX:0,scrollY:0,onclone:function(d){var e=d.getElementById("pa");e.style.left="0";e.style.top="0"}})})
.then(function(cv){var w=210,h=cv.height*w/cv.width,J=window.jspdf.jsPDF,pdf=new J({orientation:"p",unit:"mm",format:[w,h]});
pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",0,0,w,h);pdf.save(nm);msgb("تم تنزيل ملف PDF.","okmsg")})
.catch(function(){msgb("تعذّر إنشاء PDF مباشرة، ستفتح نافذة الطباعة: اختر «حفظ كـ PDF».","warn");setTimeout(doPrint,600)})}

document.addEventListener("click",function(e){var el=e.target.closest("[data-tab],[data-a],[data-open]");if(!el)return;

else if(el.dataset.open){date=el.dataset.open;tab="report";render()}
else{var a=el.dataset.a;

else if(a==="print")doPrint();else if(a==="pdf")doPdf()
else if(a==="csv"){var x1=csvOf([date]);dl("report-"+date+".csv","\ufeff"+x1,x1)}
else if(a==="csvall"){var f=hist.f||"",t=hist.t||"";var x2=csvOf(Object.keys(db).sort().filter(function(d){return(!f||d>=f)&&(!t||d<=t)}));dl("reports.csv","\ufeff"+x2,x2)}
else if(a==="saveopen")saveOpen();
else if(a==="savesettings"){S.sig=document.getElementById("sg").value.trim();S.showTank=document.getElementById("st").checked;saveS();msg='<div class="okmsg">تم حفظ الإعدادات.</div>';render()}
else if(a==="reset"){if(el.dataset.armed){db={};persist();render()}else{el.dataset.armed="1";el.textContent="اضغط مرة أخرى لتأكيد المسح"}}
else if(a==="copy"){var ta=document.getElementById("ct");ta.select();try{navigator.clipboard.writeText(ta.value)}catch(x){try{document.execCommand("copy")}catch(y){}}el.textContent="تم النسخ"}}});
document.addEventListener("change",function(e){var i=e.target.id;
if(i==="dt"){var v=en(e.target.value).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v)){date=v;msg="";render()}else{e.target.value=date}}
else if(i==="tm"){fill()}

else if(i==="hf"){hist.f=en(e.target.value).trim();render()}
else if(i==="ht"){hist.t=en(e.target.value).trim();render()}});
render();tick();
</script>
